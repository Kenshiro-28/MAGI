name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check --select=E4,E7,E9,F,S --ignore=S104,S105,S108,S110,S112,S607 --target-version py313 .
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy
        run: mypy --install-types --non-interactive --no-strict-optional --ignore-missing-imports .

